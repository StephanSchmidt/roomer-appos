# Marketing's side of Roomer: the apps. They build against the platform kit
# (kit/: HOST-API.md, the WIT contract and the SDK), never against the shell.
[workspace]
resolver = "3"
members = ["kit/sdk", "booking-grid", "pod-admin", "pod-stats", "quick-book"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
appos-sdk = { path = "kit/sdk" }
leptos = { version = "0.8", features = ["ssr"] }
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true
