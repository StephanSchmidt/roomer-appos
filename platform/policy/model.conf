# AppOS access model.
#
# A platform call is allowed only if BOTH hold:
#   g2(app, cap)   the app was granted the capability by an approved manifest
#   p(role, cap)   the signed-in user has a role that may use the capability
[request_definition]
r = app, user, cap

[policy_definition]
p = role, cap

[role_definition]
g = _, _
g2 = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g2(r.app, r.cap) && g(r.user, p.role) && r.cap == p.cap
