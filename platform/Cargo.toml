# The Roomer shell: the platform team's side. Builds the `roomer` binary.
[package]
name = "roomer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
casbin = "2.20.0"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
futures = "0.3.34"
maud = "0.27"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
toml = "1"
ureq = { version = "3", features = ["json"] }
wasmtime = "50"
wasmtime-wasi = "50"

# Its own workspace: the apps in ../apps are a separate one.
[workspace]

[profile.release]
lto = true
strip = true
